name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          else
            cp app/google-services.json.template app/google-services.json
          fi

      - name: Write local.properties from secrets
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.KINPLUS_GOOGLE_MAPS_API_KEY }}
        run: echo "KINPLUS_GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KinPlus-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: KinPlus-${{ github.ref_name }}.apk
          generate_release_notes: true
