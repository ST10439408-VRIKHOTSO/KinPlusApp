# Builds Kin+ and runs the unit tests on a clean GitHub machine for every push
# and pull request, so the app is shown to work on more than our own laptops.
#
# Based on the guides given in the PoE brief:
# Amir, F. (2026) Automated build Android app with GitHub Action. Available at:
# https://github.com/marketplace/actions/automated-build-android-app-with-github-action [Accessed 5 November 2026].
# IMAD5112 (2025) Github-actions: build.yml. Available at:
# https://github.com/IMAD5112/Github-actions/blob/main/.github/workflows/build.yml [Accessed 5 November 2026].
name: Build & test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android Gradle plugin downloads the SDK 36 platform it compiles against.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The real google-services.json is never committed, so CI builds with the placeholder.
      - name: Use placeholder Firebase config
        run: cp app/google-services.json.template app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee build-tests.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build-apk.log

      # Surfaces compiler and resource errors as a single annotation on the run,
      # so the cause of a failed build is visible without downloading the logs.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(cat build-*.log 2>/dev/null | grep -E "^e: |error:|ERROR:|What went wrong|FAILED|^   > " | head -200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinplus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
